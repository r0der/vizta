<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Agenda de Consultorios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1268a9;
  --blue-dark:#0b4f84;
  --ink:#17324a;
  --muted:#8b98a3;
  --line:#e9eef2;
  --soft:#f3f6f8;

  --morning:#b45309;
  --morning-bg:rgba(180,83,9,.11);
  --afternoon:#1268a9;
  --afternoon-bg:rgba(18,104,169,.13);
  --doctor:#12202e;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;overflow-x:hidden}
body{
  background:#f5f7f9;
  color:var(--ink);
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
.app{max-width:1050px;margin:auto;padding:18px;width:100%}
h1{font-size:28px;letter-spacing:-.7px;margin:0 0 5px}
.subtitle{margin:0 0 18px;color:var(--muted);font-size:14px}

.panel{
  background:#fff;border:1px solid var(--line);border-radius:20px;
  padding:16px;box-shadow:0 12px 35px rgba(23,50,74,.07)
}
.top{display:grid;grid-template-columns:1fr 190px;gap:12px;margin-bottom:16px;width:100%}
.top>div{min-width:0;width:100%;overflow:hidden}

label{
  display:block;font-size:10px;font-weight:800;text-transform:uppercase;
  color:var(--muted);letter-spacing:.04em;margin:0 0 5px
}
input{
  width:100%;min-width:0;max-width:100%;height:44px;box-sizing:border-box;
  border:1px solid var(--line);border-radius:11px;padding:0 11px;
  font:inherit;font-size:16px;background:#fff;outline:none;display:block;
  -webkit-appearance:none;appearance:none
}
input[type="date"],input[type="time"]{
  min-width:0;width:100%;max-width:100%;box-sizing:border-box;
  -webkit-appearance:none;appearance:none;
  -webkit-min-logical-width:0
}
.time-select{
  width:100%;min-width:0;max-width:100%;height:44px;box-sizing:border-box;
  border:1px solid var(--line);border-radius:11px;padding:0 8px;
  background:#fff;color:var(--ink);font:inherit;font-size:16px;
  outline:none;display:block;-webkit-appearance:none;appearance:none
}
.time-select:focus{
  border-color:#76add2;box-shadow:0 0 0 3px rgba(18,104,169,.09)
}
#fecha{min-width:0;width:100%;max-width:100%;box-sizing:border-box}
input:focus{border-color:#76add2;box-shadow:0 0 0 3px rgba(18,104,169,.09)}

.doctor-select-row{display:flex;gap:6px;align-items:center;width:100%}
.doctor-select{
  flex:1;min-width:0;width:100%;height:38px;box-sizing:border-box;
  border:1px solid var(--line);border-radius:9px;padding:0 9px;
  background:#fff;color:var(--ink);font:inherit;font-size:16px;
  outline:none;-webkit-appearance:auto;appearance:auto
}
.doctor-select:focus{border-color:#76add2;box-shadow:0 0 0 3px rgba(18,104,169,.09)}
.btn-add-doctor{
  flex:none;height:38px;border:1px solid var(--line);border-radius:9px;
  background:#eaf2f8;color:var(--blue-dark);font-size:16px;font-weight:900;
  padding:0 11px;cursor:pointer
}
.btn-add-doctor:hover{background:#dcecf7}


.editor{display:grid;gap:10px}
.office-edit{
  border:1px solid var(--line);border-radius:16px;padding:12px;background:#fbfcfd
}
.office-title{
  display:flex;align-items:center;gap:8px;font-size:14px;font-weight:850;
  margin-bottom:10px
}
.office-number{
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  background:#eaf4fb;color:var(--blue);font-weight:900
}
.turns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.turn{background:#f5f7f9;border-radius:12px;padding:10px}
.turn.morning{border-left:3px solid var(--morning)}
.turn.afternoon{border-left:3px solid var(--afternoon)}
.turn-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
.turn-title{
  font-size:10px;font-weight:900;text-transform:uppercase;color:var(--muted);
  margin:0
}
.btn-clear-turn{
  border:0;background:#fff;color:var(--muted);font-size:10px;font-weight:800;
  padding:4px 8px;border-radius:8px;cursor:pointer;border:1px solid var(--line);
  white-space:nowrap
}
.btn-clear-turn:hover{color:#a33;border-color:#f3c9c9;background:#fff5f5}

.slots{display:grid;gap:8px}
.slot{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px}
.slot-top{display:flex;gap:6px;align-items:center}
.slot-top input{flex:1;min-width:0}
.btn-remove-slot{
  flex:none;width:38px;height:38px;border-radius:9px;border:1px solid var(--line);
  background:#fff;color:#a33;font-weight:900;font-size:14px;cursor:pointer
}
.btn-remove-slot:hover{background:#fff5f5;border-color:#f3c9c9}
.times{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:7px;margin-top:7px;width:100%
}
.times>div{min-width:0;width:100%;overflow:hidden}
.btn-add-slot{
  width:100%;margin-top:8px;border:1.5px dashed #c6d6e0;background:#fff;
  color:var(--blue-dark);font-size:12px;font-weight:800;padding:9px;
  border-radius:10px;cursor:pointer
}
.btn-add-slot:hover{background:#eaf2f8}

.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
button{
  border:0;border-radius:11px;padding:11px 15px;font:inherit;font-size:13px;
  font-weight:800;cursor:pointer
}
.primary{background:var(--blue);color:#fff}
.secondary{background:#eaf2f8;color:var(--blue-dark)}
.danger{background:#fff0f0;color:#a33}
.hint{font-size:11px;color:var(--muted);margin-top:9px}

/* ===================== PREVIEW / EXPORT CARD (shared look) ===================== */
.preview-title{margin:25px 0 9px;font-weight:900;font-size:15px}

/*
  El wrapper escala el card completo (siempre renderizado a 900px de ancho,
  igual que en PC) para que la vista previa en móvil sea exactamente la
  misma composición, solo más chica — nunca un layout distinto.
*/
.preview-wrap{overflow:hidden;position:relative;width:100%}
.scale-outer{width:900px;transform-origin:top left}

.card{
  width:900px;margin:0;background:#fff;border-radius:0;
  overflow:hidden;box-shadow:0 16px 45px rgba(23,50,74,.12)
}
.card-head{
  background:linear-gradient(155deg,#0b4f84,#1a7ac0);
  color:#fff;height:130px;padding:18px 34px;position:relative;
  display:flex;align-items:center;justify-content:space-between
}
.header-pueyrredon{
  display:flex;align-items:center
}
.header-pueyrredon img{
  height:58px;width:auto;display:block
}
.header-siegfried{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:7px
}
.header-siegfried img{
  height:50px;width:auto;display:block
}
.date-sub{
  font-size:14px;font-weight:800;letter-spacing:-.1px;line-height:1.2;
  margin:0;opacity:.96;text-align:center;white-space:nowrap
}

.rows{padding:4px 18px 10px}
.row{
  display:grid;
  grid-template-columns:46px repeat(var(--shifts,2),1fr);
  --row-gap:10px;column-gap:var(--row-gap);
  align-items:center;
  min-height:96px;padding:14px 0;
  border-bottom:1px solid var(--line)
}
.row:last-child{border-bottom:0}
.number{
  font-size:32px;font-weight:900;color:var(--blue);letter-spacing:-1px;
  text-align:center
}
/* Cada turno (mañana/tarde) tiene su propio fondo suave para distinguirse
   de un vistazo cuando hay varios médicos alternados en un consultorio */
.shift{min-width:0;border-radius:12px;padding:10px 12px}
.shift.morning{background:var(--morning-bg)}
.shift.afternoon{background:var(--afternoon-bg)}

.badge-row{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.badge{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;
  padding:4px 11px;border-radius:20px;background:rgba(255,255,255,.65)
}
.badge .dot{width:6px;height:6px;border-radius:50%;flex:none}
.badge.morning{color:var(--morning)}
.badge.morning .dot{background:var(--morning)}
.badge.afternoon{color:var(--afternoon)}
.badge.afternoon .dot{background:var(--afternoon)}

/* Chip neutro con el número de consultorio, al lado del chip de turno */
.badge-office{
  display:inline-flex;align-items:center;
  font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;
  padding:4px 10px;border-radius:20px;
  background:rgba(139,152,163,.16);color:var(--muted)
}

.doctor{
  font-size:20px;font-weight:900;line-height:24px;letter-spacing:-.2px;
  color:var(--doctor);text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.doctor.empty{color:var(--doctor);opacity:.55}
.time{font-size:19px;font-weight:800;margin-top:6px}
.time.morning{color:var(--morning)}
.time.afternoon{color:var(--afternoon)}

/* Cuando un consultorio tiene 3 o más médicos en el día, se achica un poco
   el contenido de esa fila puntual para que todo siga entrando prolijo.
   El número de consultorio NUNCA cambia de tamaño. */
.row:has(.shift:nth-child(4)) .badge-row{margin-bottom:6px}
.row:has(.shift:nth-child(4)) .badge{font-size:10.5px;padding:3px 9px}
.row:has(.shift:nth-child(4)) .badge-office{font-size:9.5px;padding:3px 8px}
.row:has(.shift:nth-child(4)) .doctor{font-size:16px;line-height:19px}
.row:has(.shift:nth-child(4)) .time{font-size:15px;margin-top:4px}
.row:has(.shift:nth-child(4)) .shift{padding:8px 10px}

.footer{
  margin:8px 18px 26px;padding:9px 14px;background:var(--soft);
  border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;
  color:var(--muted);font-size:11px;font-weight:700
}

/* A4 — todo el contenido tiene que entrar en una sola hoja */
/*
  Impresión: en vez de mantener un segundo juego de medidas en mm (que se
  desincroniza cada vez que se ajusta el diseño de escritorio), reusamos
  el mismo card de 900px de la vista previa / export y lo escalamos con
  JS (ver applyPrintScale) para que entre completo en una hoja A4. Así la
  proporción impresa es siempre idéntica a la del JPEG exportado.
*/
@media print{
  body{background:#fff}
  .app{padding:0;max-width:none;margin:0}
  .app>h1,.app>.subtitle,.app>.panel,.preview-title{display:none!important}
  .preview-wrap{overflow:visible;margin:0 auto}
  .scale-outer{transform-origin:top left}
  .card{box-shadow:none}

  @page{size:A4 portrait;margin:10mm}
}

@media(max-width:700px){
  .app{padding:10px}
  .top{grid-template-columns:minmax(0,1fr);width:100%}
  .panel{padding:10px}
  .turns{grid-template-columns:1fr}
  .office-edit{padding:10px}
  input{font-size:16px;padding:0 9px;height:42px}
  input[type="date"]{font-size:16px;padding-left:9px;padding-right:9px}
  .time-select{height:42px;font-size:16px;padding:0 7px}
  .times{gap:6px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
}

@media(max-width:360px){
  .times{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <h1>Agenda de Consultorios</h1>
  <p class="subtitle">Cargá el médico y horario de cada turno.</p>

  <div class="panel">
    <div class="top">
      <div><label>Fecha</label><input id="fecha" type="date"></div>
    </div>

    <div id="editor" class="editor"></div>

    <div class="actions">
      <button class="primary" id="btnShare">📲 WhatsApp / compartir</button>
      <button class="secondary" id="btnPdf">📄 Exportar PDF</button>
      <button class="secondary" id="btnJpg">🖼️ Exportar JPEG</button>
      <button class="secondary" id="btnMail">✉️ Email</button>
      <button class="secondary" onclick="window.print()">🖨️ Imprimir A4</button>
      <button class="danger" id="btnClear">Limpiar</button>
    </div>
    <div class="hint">El PDF y la imagen conservan exactamente el diseño de la vista previa, en alta resolución. Para WhatsApp, el PDF llega más nítido porque no se recomprime como una foto.</div>
  </div>

  <div class="preview-title">Vista previa</div>
  <div class="preview-wrap" id="previewWrap">
    <div class="scale-outer" id="scaleOuter">
      <div class="card" id="card">
        <div class="card-head">
          <div class="header-pueyrredon">
            <img src="../Turnos/pueyrredon.png" alt="Clínica Pueyrredón">
          </div>
          <div class="header-siegfried">
            <img src="../Turnos/siegfried.png" alt="Laboratorio Siegfried">
            <div class="date-sub" id="pfecha"></div>
          </div>
        </div>
        <div class="rows" id="previewRows"></div>
        <div class="footer">Cronograma de atención generado digitalmente</div>
      </div>
    </div>
  </div>
  </div>

<script>
const OLD_KEY='agenda_consultorios_v4';
const KEY='agenda_consultorios_v6';
const MAX_SLOTS=2; // médicos máximos por turno (mañana / tarde) en un mismo consultorio -> 1 base + 1 extra = máximo 4 por día por consultorio

const editor=document.getElementById('editor');
const fecha=document.getElementById('fecha');

const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function formatFecha(d){
  if(!d) return '';
  const dia=DIAS[d.getDay()];
  const nro=String(d.getDate()).padStart(2,'0');
  const mesNum=String(d.getMonth()+1).padStart(2,'0');
  const anio=d.getFullYear();
  const texto=`${dia}, ${nro}/${mesNum}/${anio}`;
  return texto.charAt(0).toUpperCase()+texto.slice(1);
}

function today(){
  const d=new Date(), off=d.getTimezoneOffset();
  return new Date(d.getTime()-off*60000).toISOString().slice(0,10);
}
fecha.value=today();

function esc(s){
  return String(s||'')
    .replaceAll('&','&amp;').replaceAll('"','&quot;')
    .replaceAll('<','&lt;').replaceAll('>','&gt;');
}

function buildTimeOptions(select,start,end,selected=''){
  const [sh,sm]=start.split(':').map(Number);
  const [eh,em]=end.split(':').map(Number);
  const startMin=sh*60+sm;
  const endMin=eh*60+em;
  let options='<option value="">Seleccionar</option>';

  for(let m=startMin;m<=endMin;m+=15){
    const hh=String(Math.floor(m/60)).padStart(2,'0');
    const mm=String(m%60).padStart(2,'0');
    const value=`${hh}:${mm}`;
    options+=`<option value="${value}">${value}</option>`;
  }
  select.innerHTML=options;
  if(selected && [...select.options].some(o=>o.value===selected)) select.value=selected;
}


function escapeHtml(value){
  return String(value)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

const DOCTORS_KEY='agenda_medicos_v1';

const DEFAULT_DOCTORS=[
  'BERCOVSKY',
  'BESCOS',
  'BOTTO',
  'CASTAÑO',
  'CHILANO',
  'COLAVITA',
  'DIMURO',
  'ELICABE',
  'ESTEVEZ',
  'FORTUNA',
  'GANCITANO',
  'GOMEZ FERRANTE',
  'GUILARDENGHI',
  'IRIART',
  'MACCIO',
  'MARTINEZ R.',
  'MEZZAPELLE',
  'MOLINA',
  'MOLLO',
  'MONTOYA G.',
  'PUENTE',
  'RAGONESE C.',
  'RAGONESE G.',
  'REITOVICH',
  'REQUINA',
  'RESINA',
  'RIVAROLA',
  'STRAMAZZO',
  'VALENTI',
  'VILLANI',
  'VILLARINO'
];

function sortDoctors(list){
  return [...new Set(list.map(x=>String(x).trim()).filter(Boolean))]
    .sort((a,b)=>a.localeCompare(b,'es',{sensitivity:'base'}));
}

function getDoctors(){
  try{
    const saved=JSON.parse(localStorage.getItem(DOCTORS_KEY));
    if(Array.isArray(saved) && saved.length){
      const sorted=sortDoctors(saved);
      localStorage.setItem(DOCTORS_KEY,JSON.stringify(sorted));
      return sorted;
    }
  }catch(e){}
  const initial=sortDoctors(DEFAULT_DOCTORS);
  localStorage.setItem(DOCTORS_KEY,JSON.stringify(initial));
  return initial;
}

function saveDoctors(list){
  localStorage.setItem(DOCTORS_KEY,JSON.stringify(sortDoctors(list)));
}

function doctorOptions(selected=''){
  const doctors=getDoctors();
  let html='<option value="">Seleccionar médico</option>';
  doctors.forEach(name=>{
    html+=`<option value="${escapeHtml(name)}"${name===selected?' selected':''}>${escapeHtml(name)}</option>`;
  });
  return html;
}

function refreshDoctorSelects(){
  document.querySelectorAll('.doctor-select').forEach(select=>{
    const current=select.value;
    select.innerHTML=doctorOptions(current);
    select.value=current;
  });
}

function addDoctor(button){
  const name=prompt('Ingrese el apellido del nuevo médico:');
  if(name===null) return;

  const clean=name.trim().replace(/\s+/g,' ');
  if(!clean){
    alert('Ingrese un nombre válido.');
    return;
  }

  const list=getDoctors();
  const exists=list.some(d=>d.localeCompare(clean,'es',{sensitivity:'base'})===0);

  if(exists){
    alert('Ese médico ya está en la lista.');
    return;
  }

  list.push(clean);
  saveDoctors(list);

  // Actualiza todos los desplegables manteniendo sus selecciones.
  refreshDoctorSelects();

  // Selecciona el médico recién agregado solamente en el desplegable
  // desde el cual se pulsó el botón "+".
  const row=button.closest('.doctor-select-row');
  const select=row ? row.querySelector('.doctor-select') : null;
  if(select){
    select.value=clean;
  }

  update();
}

function suffixFor(idx){ return idx===0?'':String(idx+1); }

function createOffice(n,data={}){
  const box=document.createElement('div');
  box.className='office-edit';
  box.innerHTML=`
    <div class="office-title">
      <span class="office-number">${n}</span>
      Consultorio ${n}
    </div>
    <div class="turns">
      <div class="turn morning" data-turno="manana">
        <div class="turn-head">
          <p class="turn-title">☀️ Turno mañana</p>
          <button type="button" class="btn-clear-turn" data-clear="manana">Vaciar</button>
        </div>
        <div class="slots" data-prefix="manana"></div>
        <button type="button" class="btn-add-slot" data-add="manana">+ Agregar turno</button>
      </div>
      <div class="turn afternoon" data-turno="tarde">
        <div class="turn-head">
          <p class="turn-title">🌙 Turno tarde</p>
          <button type="button" class="btn-clear-turn" data-clear="tarde">Vaciar</button>
        </div>
        <div class="slots" data-prefix="tarde"></div>
        <button type="button" class="btn-add-slot" data-add="tarde">+ Agregar turno</button>
      </div>
    </div>`;
  editor.appendChild(box);

  function updateAddButtonState(prefix){
    const wrap=box.querySelector(`.slots[data-prefix="${prefix}"]`);
    const btn=box.querySelector(`.btn-add-slot[data-add="${prefix}"]`);
    btn.style.display = wrap.children.length>=MAX_SLOTS ? 'none' : '';
  }

  function renumberSlots(prefix){
    const wrap=box.querySelector(`.slots[data-prefix="${prefix}"]`);
    [...wrap.children].forEach((slotDiv,idx)=>{
      const suffix=suffixFor(idx);
      const input=slotDiv.querySelector('.doctor-select');
      const selects=slotDiv.querySelectorAll('.time-select');
      input.dataset.key=`${prefix}Medico${suffix}`;
      selects[0].dataset.key=`${prefix}Desde${suffix}`;
      selects[1].dataset.key=`${prefix}Hasta${suffix}`;
    });
  }

  function addSlot(prefix,slotData={}){
    const wrap=box.querySelector(`.slots[data-prefix="${prefix}"]`);
    const idx=wrap.children.length;
    if(idx>=MAX_SLOTS) return;
    const suffix=suffixFor(idx);
    const removable=idx>0;

    // El turno tarde no necesita horarios de la mañana: acota el rango
    // de opciones para que cargar sea más rápido y tenga sentido.
    const range = prefix==='tarde' ? {start:'11:00',end:'20:00'} : {start:'08:00',end:'20:00'};

    const div=document.createElement('div');
    div.className='slot';
    div.innerHTML=`
      <div class="slot-top">
        <div class="doctor-select-row">
          <select data-key="${prefix}Medico${suffix}" class="doctor-select">${doctorOptions(slotData.medico||'')}</select>
          <button type="button" class="btn-add-doctor" title="Agregar nuevo médico">+</button>
        </div>
        ${removable?'<button type="button" class="btn-remove-slot" title="Quitar médico">✕</button>':''}
      </div>
      <div class="times">
        <div><label>Desde</label><select data-key="${prefix}Desde${suffix}" class="time-select" data-start="${range.start}" data-end="${range.end}"></select></div>
        <div><label>Hasta</label><select data-key="${prefix}Hasta${suffix}" class="time-select" data-start="${range.start}" data-end="${range.end}"></select></div>
      </div>`;
    wrap.appendChild(div);

    div.querySelector('.doctor-select').addEventListener('change',update);
    div.querySelector('.btn-add-doctor').addEventListener('click',e=>addDoctor(e.currentTarget));

    const selects=div.querySelectorAll('.time-select');
    buildTimeOptions(selects[0],range.start,range.end,slotData.desde||'');
    buildTimeOptions(selects[1],range.start,range.end,slotData.hasta||'');
    selects.forEach(s=>s.addEventListener('input',update));

    if(removable){
      div.querySelector('.btn-remove-slot').addEventListener('click',()=>{
        div.remove();
        renumberSlots(prefix);
        updateAddButtonState(prefix);
        update();
      });
    }
    updateAddButtonState(prefix);
  }

  box.querySelectorAll('.btn-add-slot').forEach(btn=>{
    btn.addEventListener('click',()=>{
      addSlot(btn.dataset.add,{});
      update();
    });
  });

  box.querySelectorAll('.btn-clear-turn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const prefix=btn.dataset.clear;
      const wrap=box.querySelector(`.slots[data-prefix="${prefix}"]`);
      wrap.innerHTML='';
      addSlot(prefix,{});
      update();
    });
  });

  ['manana','tarde'].forEach(prefix=>{
    let count=0;
    while(count<MAX_SLOTS){
      const suffix=suffixFor(count);
      const has = data[`${prefix}Medico${suffix}`]!==undefined ||
                  data[`${prefix}Desde${suffix}`]!==undefined ||
                  data[`${prefix}Hasta${suffix}`]!==undefined;
      if(!has) break;
      count++;
    }
    if(count===0) count=1;
    for(let i=0;i<count;i++){
      const suffix=suffixFor(i);
      addSlot(prefix,{
        medico:data[`${prefix}Medico${suffix}`]||'',
        desde:data[`${prefix}Desde${suffix}`]||'',
        hasta:data[`${prefix}Hasta${suffix}`]||''
      });
    }
  });
}

function getData(){
  return [...editor.children].map((box,i)=>{
    const o={n:i+1};
    box.querySelectorAll('[data-key]').forEach(el=>{
      o[el.dataset.key]=(el.value||'').trim();
    });
    return o;
  });
}

function save(){
  localStorage.setItem(KEY,JSON.stringify({
    fecha:fecha.value,rows:getData()
  }));
}

function readOldData(){
  try{
    return JSON.parse(localStorage.getItem(OLD_KEY)||'null');
  }catch(e){return null}
}

function shiftHTML(doc,from,to,label,type,officeNum){
  const hasDoc=!!doc;
  const doctorText=hasDoc?esc(doc):'Sin asignar';
  const timeText=(from||to)?`${esc(from)||'—'} - ${esc(to)||'—'} hs`:'— — — —';
  return `<div class="shift ${type}">
    <div class="badge-row">
      <div class="badge ${type}"><span class="dot"></span>${label}</div>
      <div class="badge-office">Consultorio ${officeNum}</div>
    </div>
    <div class="doctor ${type}${hasDoc?'':' empty'}">${doctorText}</div>
    <div class="time ${type}">${timeText}</div>
  </div>`;
}

function minutesOf(hhmm){
  if(!hhmm) return null;
  const [h,m]=hhmm.split(':').map(Number);
  return h*60+m;
}

/* Lee los médicos cargados de un turno (mañana o tarde) dentro de un
   consultorio. El primer slot siempre se conserva (aunque esté vacío,
   para mantener la estructura visual); los siguientes solo se incluyen
   si tienen algún dato cargado. */
function readSlots(box,prefix,type){
  const wrap=box.querySelector(`.slots[data-prefix="${prefix}"]`);
  return [...wrap.children].map((div,idx)=>{
    const medico=div.querySelector('.doctor-select').value.trim();
    const selects=div.querySelectorAll('.time-select');
    return {medico,desde:selects[0].value,hasta:selects[1].value,type,idx};
  }).filter(s=>s.idx===0 || s.medico || s.desde || s.hasta);
}

function sortShifts(list){
  return list.slice().sort((a,b)=>{
    const am=minutesOf(a.desde), bm=minutesOf(b.desde);
    const ak=am!==null?am:(a.type==='morning'?-1:100000);
    const bk=bm!==null?bm:(b.type==='morning'?-1:100000);
    return ak-bk;
  });
}

/*
  Escala el card completo (renderizado siempre a 900px, igual que en PC)
  en lugar de cambiar sus estilos internos. Así la vista previa en
  pantalla, la impresión y el JPEG exportado son siempre la misma
  composición, solo a distinta escala.
*/
const PX_PER_MM=96/25.4;

function computeScale(maxWidthPx,maxHeightPx){
  const card=document.getElementById('card');
  const naturalHeight=card.offsetHeight; // no afectado por transform
  let scale=maxWidthPx>0?Math.min(1,maxWidthPx/900):1;
  if(maxHeightPx){
    scale=Math.min(scale, naturalHeight>0?maxHeightPx/naturalHeight:scale);
  }
  return {scale,naturalHeight};
}

function applyPreviewScale(){
  const wrap=document.getElementById('previewWrap');
  const outer=document.getElementById('scaleOuter');
  if(!wrap||!outer) return;
  // Importante: primero limpiamos cualquier ancho fijo que haya quedado
  // de una impresión anterior, y recién después medimos el ancho
  // disponible — si no, se mide el tamaño chico usado para A4 en vez
  // del ancho real de la pantalla.
  wrap.style.width='';
  const {scale,naturalHeight}=computeScale(wrap.clientWidth);
  outer.style.transform=`scale(${scale})`;
  wrap.style.height=(naturalHeight*scale)+'px';
}
window.addEventListener('resize',applyPreviewScale);

/*
  Impresión: escala el mismo card de 900px para que entre completo en una
  hoja A4 (margen de 10mm por lado), tomando el límite más estricto entre
  ancho y alto disponibles — así siempre entra todo en una sola hoja.
*/
function applyPrintScale(){
  const wrap=document.getElementById('previewWrap');
  const outer=document.getElementById('scaleOuter');
  if(!wrap||!outer) return;
  const marginMM=10, pageWidthMM=210, pageHeightMM=297;
  const maxWidthPx=(pageWidthMM-marginMM*2)*PX_PER_MM;
  const maxHeightPx=(pageHeightMM-marginMM*2)*PX_PER_MM;
  const {scale,naturalHeight}=computeScale(maxWidthPx,maxHeightPx);
  outer.style.transform=`scale(${scale})`;
  wrap.style.width=(900*scale)+'px';
  wrap.style.height=(naturalHeight*scale)+'px';
}
window.addEventListener('beforeprint',applyPrintScale);
window.addEventListener('afterprint',applyPreviewScale);

function update(){
  save();

  const d=fecha.value?new Date(fecha.value+'T12:00:00'):null;
  document.getElementById('pfecha').textContent=formatFecha(d);

  document.getElementById('previewRows').innerHTML=[...editor.children].map((box,i)=>{
    const officeNum=i+1;
    const shifts=sortShifts([
      ...readSlots(box,'manana','morning'),
      ...readSlots(box,'tarde','afternoon')
    ]);
    const shiftsHTML=shifts.map(s=>
      shiftHTML(s.medico,s.desde,s.hasta,s.type==='morning'?'Mañana':'Tarde',s.type,officeNum)
    ).join('');
    return `<div class="row" style="--shifts:${shifts.length}">
      <div class="number">${officeNum}</div>
      ${shiftsHTML}
    </div>`;
  }).join('');

  requestAnimationFrame(applyPreviewScale);
}

function load(){
  let saved=null;
  try{
    saved=JSON.parse(localStorage.getItem(KEY)||'null');
    if(!saved){
      const old=readOldData();
      if(old){
        saved=old;
        localStorage.setItem(KEY,JSON.stringify(old));
      }
    }
  }catch(e){}

  editor.innerHTML='';
  const rows=(saved && saved.rows) || [];
  // La fecha NUNCA se restaura del caché: siempre debe mostrar el día
  // actual al entrar, así no hay que actualizarla a mano. Los médicos y
  // horarios sí se mantienen guardados.
  for(let i=1;i<=10;i++){
    createOffice(i, rows[i-1]||{});
  }
  update();
}

async function renderCanvas(){
  if(document.fonts && document.fonts.ready){
    try{
      await document.fonts.ready;
    }catch(e){}
  }

  const original=document.getElementById('card');

  // Creamos una copia independiente para exportación.
  const clone=original.cloneNode(true);

  // Contenedor fuera de pantalla.
  const exportWrap=document.createElement('div');

  exportWrap.style.position='fixed';
  exportWrap.style.left='-100000px';
  exportWrap.style.top='0';
  exportWrap.style.width='900px';
  exportWrap.style.background='#fff';
  exportWrap.style.zIndex='-1';
  exportWrap.style.overflow='visible';

  // El card SIEMPRE se exporta a 900px: la vista previa ya se renderiza a
  // ese mismo ancho fijo (solo se ve "escalada" visualmente en pantalla),
  // así que no hace falta forzar ningún otro estilo acá.
  clone.style.width='900px';
  clone.style.maxWidth='900px';
  clone.style.minWidth='900px';
  clone.style.margin='0';
  clone.style.borderRadius='0';
  clone.style.boxShadow='none';
  clone.style.transform='none';

  exportWrap.appendChild(clone);
  document.body.appendChild(exportWrap);

  // Esperamos a que las imágenes del clon estén listas.
  const imgs=[...clone.querySelectorAll('img')];

  await Promise.all(
    imgs.map(img=>{
      if(img.complete && img.naturalWidth){
        return Promise.resolve();
      }

      return new Promise(resolve=>{
        img.onload=resolve;
        img.onerror=resolve;
      });
    })
  );

  // Pequeña espera para asegurar render de fuentes/layout.
  await new Promise(resolve=>requestAnimationFrame(()=>{
    requestAnimationFrame(resolve);
  }));

  const rect=clone.getBoundingClientRect();

  /*
   * Exportación SIEMPRE basada en 900 px.
   * No depende del ancho del teléfono.
   */
  const EXPORT_WIDTH=1800;

  const scale=EXPORT_WIDTH/rect.width;

  const canvas=await html2canvas(clone,{
    scale:scale,
    width:rect.width,
    height:rect.height,
    backgroundColor:'#fff',
    useCORS:true,
    allowTaint:false,
    imageTimeout:15000,
    logging:false,
    scrollX:0,
    scrollY:0,
    windowWidth:900,
    windowHeight:rect.height
  });

  exportWrap.remove();

  return canvas;
}

async function makeJpgBlob(){
  const canvas=await renderCanvas();
  return await new Promise(resolve=>{
    canvas.toBlob(resolve,'image/jpeg',1);
  });
}

/*
  WhatsApp (y otras apps) recomprimen mucho las fotos que se envían como
  imagen, así que el texto queda borroso. Un PDF se manda como documento
  y no se recomprime, por eso conviene para compartir. Armamos una sola
  página con el tamaño exacto de la agenda (sin franjas en blanco).
*/
async function makePdfBlob(){
  const canvas=await renderCanvas();
  const imgData=canvas.toDataURL('image/png');
  const {jsPDF}=window.jspdf;
  const widthMM=190;
  const heightMM=widthMM*(canvas.height/canvas.width);
  const pdf=new jsPDF({
    orientation: heightMM>=widthMM?'portrait':'landscape',
    unit:'mm',
    format:[widthMM,heightMM]
  });
  pdf.addImage(imgData,'PNG',0,0,widthMM,heightMM);
  return pdf.output('blob');
}

async function exportPDF(){
  const blob=await makePdfBlob();
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='agenda_'+(fecha.value||'fecha')+'.pdf';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

async function exportJPG(){
  const blob=await makeJpgBlob();
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='agenda_'+(fecha.value||'fecha')+'.jpg';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

/*
  El share nativo del sistema operativo (navigator.share) funciona bien
  en celulares, pero en PC (Windows/Mac) suele fallar o mostrar un error
  del navegador ("no fue posible mostrarte todas las formas de
  compartir") porque el sistema no tiene apps registradas para recibir
  archivos compartidos. Por eso en PC vamos directo a descargar el
  archivo en vez de intentar el share nativo.
*/
function isMobileDevice(){
  const uaMobile=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  const coarsePointer=window.matchMedia && window.matchMedia('(pointer:coarse)').matches;
  return uaMobile || ((navigator.maxTouchPoints||0)>0 && coarsePointer);
}

async function share(){
  const blob=await makePdfBlob();
  const file=new File([blob],'agenda_'+(fecha.value||'fecha')+'.pdf',{type:'application/pdf'});
  if(isMobileDevice() && navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
    try{
      await navigator.share({
        title:'Agenda de consultorios',
        text:'Agenda diaria',
        files:[file]
      });
      return;
    }catch(e){
      if(e.name==='AbortError') return;
    }
  }
  await exportPDF();
  alert('El PDF fue descargado. Podés adjuntarlo desde WhatsApp como documento.');
}

async function mail(){
  const blob=await makePdfBlob();
  const file=new File([blob],'agenda_'+(fecha.value||'fecha')+'.pdf',{type:'application/pdf'});

  if(isMobileDevice() && navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
    try{
      await navigator.share({
        title:'Agenda de consultorios',
        text:'Agenda diaria',
        files:[file]
      });
      return;
    }catch(e){
      if(e.name==='AbortError') return;
    }
  }

  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=file.name;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);

  location.href='mailto:?subject='+encodeURIComponent(
    'Agenda de consultorios - '+fecha.value
  )+'&body='+encodeURIComponent(
    'Adjunto la agenda de consultorios del día.'
  );
}

function clearAll(){
  if(!confirm('¿Borrar todos los médicos y horarios?')) return;
  // Reconstruimos cada consultorio desde cero: esto no solo vacía los
  // valores, sino que también cierra cualquier slot extra que se haya
  // agregado, dejando cada turno con un único slot vacío (igual que al
  // abrir la app por primera vez).
  editor.innerHTML='';
  for(let i=1;i<=10;i++){
    createOffice(i,{});
  }
  update();
}

fecha.addEventListener('input',update);
document.getElementById('btnPdf').addEventListener('click',exportPDF);
document.getElementById('btnJpg').addEventListener('click',exportJPG);
document.getElementById('btnShare').addEventListener('click',share);
document.getElementById('btnMail').addEventListener('click',mail);
document.getElementById('btnClear').addEventListener('click',clearAll);

load();
</script>
